name: Validate Local Owner Reset

on:
  push:
    branches:
      - feature/local-owner-reset
    paths:
      - "native/windows/racknova_owner_reset.py"
      - "native/windows/racknova_native_entry.py"
      - ".github/workflows/validate-local-owner-reset.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: racknova_test
          POSTGRES_DB: racknova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d racknova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout backend branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate backend Python syntax
        run: |
          python -m py_compile native/windows/racknova_owner_reset.py
          python -m py_compile native/windows/racknova_native_entry.py

      - name: Install reset integration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install --disable-pip-version-check fastapi pydantic sqlalchemy sqlmodel psycopg2-binary

      - name: Integration test backup and local reset
        env:
          PROGRAMDATA: ${{ runner.temp }}/RackNovaProgramData
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          from sqlalchemy import create_engine, text
          from sqlmodel import Session

          sys.path.insert(0, str(Path("native/windows").resolve()))
          import racknova_owner_reset as reset

          engine = create_engine(
              "postgresql+psycopg2://postgres:racknova_test@127.0.0.1:5432/racknova",
              future=True,
          )

          schema = """
          DROP SCHEMA public CASCADE;
          CREATE SCHEMA public;

          CREATE TABLE empresas (
              id_empresa UUID PRIMARY KEY
          );

          CREATE TABLE usuario (
              id_usuario SERIAL PRIMARY KEY,
              usuario TEXT NOT NULL,
              rol TEXT NOT NULL,
              activo BOOLEAN NOT NULL DEFAULT TRUE,
              fecha_creacion TIMESTAMPTZ DEFAULT NOW()
          );

          CREATE TABLE empresa_usuarios (
              id SERIAL PRIMARY KEY,
              empresa_id UUID NOT NULL
          );

          CREATE TABLE racknova_nodos (
              id SERIAL PRIMARY KEY,
              codigo TEXT NOT NULL
          );

          CREATE TABLE racknova_sync_cursor (
              id SERIAL PRIMARY KEY,
              marker TEXT
          );

          CREATE TABLE racknova_sync_pos_cursor (
              id SERIAL PRIMARY KEY,
              marker TEXT
          );

          CREATE TABLE producto (
              id_producto SERIAL PRIMARY KEY,
              nombre TEXT NOT NULL
          );

          CREATE TABLE movimiento (
              id_mov SERIAL PRIMARY KEY,
              accion TEXT NOT NULL
          );

          CREATE TABLE racknova_sync_outbox (
              id SERIAL PRIMARY KEY,
              payload TEXT
          );
          """

          with engine.begin() as conn:
              conn.execute(text(schema))
              conn.execute(text(
                  "INSERT INTO empresas VALUES ('11111111-1111-4111-8111-111111111111')"
              ))
              conn.execute(text(
                  "INSERT INTO usuario(usuario,rol,activo) VALUES ('owner','admin',TRUE)"
              ))
              conn.execute(text(
                  "INSERT INTO empresa_usuarios(empresa_id) VALUES ('11111111-1111-4111-8111-111111111111')"
              ))
              conn.execute(text(
                  "INSERT INTO racknova_nodos(codigo) VALUES ('LOCAL-TEST')"
              ))
              conn.execute(text(
                  "INSERT INTO racknova_sync_cursor(marker) VALUES ('keep-cursor')"
              ))
              conn.execute(text(
                  "INSERT INTO racknova_sync_pos_cursor(marker) VALUES ('keep-pos-cursor')"
              ))
              conn.execute(text(
                  "INSERT INTO producto(nombre) VALUES ('Producto viejo')"
              ))
              conn.execute(text(
                  "INSERT INTO movimiento(accion) VALUES ('VENTA')"
              ))
              conn.execute(text(
                  "INSERT INTO racknova_sync_outbox(payload) VALUES ('pending-old-event')"
              ))

          backup = reset._backup_database(
              config={
                  "db_host": "127.0.0.1",
                  "db_port": 5432,
                  "db_name": "racknova",
                  "pg_super_user": "postgres",
              },
              secrets={"pg_super_password": "racknova_test"},
              actor="owner",
          )
          dump_file = backup / "racknova-before-reset.dump"
          assert dump_file.exists() and dump_file.stat().st_size > 0, dump_file

          with Session(engine) as session:
              result = reset._reset_local_data(session)

          assert result["rows_removed"] >= 3, result

          with engine.connect() as conn:
              preserved = {
                  table: conn.execute(text(f"SELECT COUNT(*) FROM {table}")).scalar_one()
                  for table in (
                      "empresas",
                      "usuario",
                      "empresa_usuarios",
                      "racknova_nodos",
                      "racknova_sync_cursor",
                      "racknova_sync_pos_cursor",
                  )
              }
              cleared = {
                  table: conn.execute(text(f"SELECT COUNT(*) FROM {table}")).scalar_one()
                  for table in ("producto", "movimiento", "racknova_sync_outbox")
              }

          assert all(value == 1 for value in preserved.values()), preserved
          assert all(value == 0 for value in cleared.values()), cleared
          print("OWNER RESET INTEGRATION TEST OK")
          print("backup=", backup)
          print("preserved=", preserved)
          print("cleared=", cleared)
          PY

      - name: Checkout dashboard branch
        uses: actions/checkout@v4
        with:
          repository: racknova096-dot/racknova-dashboard
          ref: feature/local-owner-reset
          path: dashboard

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
