name: Validate Scan Sync Identity

on:
  push:
    branches:
      - feat/scan-config-location-sync

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: racknova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d racknova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/racknova_test?sslmode=disable
      RACKNOVA_MODE: cloud
      RACKNOVA_NODE_CODE: CLOUD-TEST
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/scan-config-location-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic identity patch
        run: python scripts/patch_scan_sync_identity.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile scan_control_module.py main.py racknova_sync_capture.py racknova_sync_worker.py
      - name: Prepare pre-sync tables
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d racknova_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE empresas (
            id_empresa UUID PRIMARY KEY,
            nombre VARCHAR(180) DEFAULT 'Test',
            slug VARCHAR(180) DEFAULT 'test',
            activo BOOLEAN NOT NULL DEFAULT TRUE,
            plan VARCHAR(80) DEFAULT 'test',
            moneda VARCHAR(20) DEFAULT 'MXN',
            zona_horaria VARCHAR(80) DEFAULT 'America/Mexico_City'
          );
          INSERT INTO empresas(id_empresa) VALUES ('11111111-1111-4111-8111-111111111111');
          CREATE TABLE racknova_scan_configuracion (
            empresa_id UUID NOT NULL,
            id_configuracion UUID PRIMARY KEY,
            pos_verificacion_requerida BOOLEAN NOT NULL DEFAULT FALSE,
            ubicacion_verificacion_requerida BOOLEAN NOT NULL DEFAULT FALSE,
            hid_habilitado BOOLEAN NOT NULL DEFAULT TRUE,
            camara_habilitada BOOLEAN NOT NULL DEFAULT TRUE,
            fecha_actualizacion TIMESTAMP NOT NULL,
            actualizado_por VARCHAR NOT NULL DEFAULT 'Sistema'
          );
          INSERT INTO racknova_scan_configuracion
          VALUES (
            '11111111-1111-4111-8111-111111111111',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            FALSE,FALSE,TRUE,TRUE,NOW(),'Sistema'
          );
          CREATE TABLE racknova_ubicacion_identidad (
            empresa_id UUID NOT NULL,
            id_ubicacion UUID PRIMARY KEY,
            codigo_ubicacion VARCHAR NOT NULL UNIQUE,
            nombre VARCHAR NOT NULL,
            rack VARCHAR, nivel VARCHAR, posicion VARCHAR, descripcion VARCHAR,
            activa BOOLEAN NOT NULL DEFAULT TRUE,
            fecha_creacion TIMESTAMP NOT NULL,
            fecha_actualizacion TIMESTAMP NOT NULL,
            creado_por VARCHAR NOT NULL DEFAULT 'Sistema',
            actualizado_por VARCHAR NOT NULL DEFAULT 'Sistema'
          );
          INSERT INTO racknova_ubicacion_identidad
          VALUES (
            '11111111-1111-4111-8111-111111111111',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
            'RNLOC:bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
            'Rack Test',NULL,NULL,NULL,NULL,TRUE,NOW(),NOW(),'Sistema','Sistema'
          );
          SQL
      - name: Run migration and assert deterministic identities
        run: |
          python - <<'PY'
          import main
          from sqlmodel import SQLModel, Session
          from sqlalchemy import text
          from database import engine
          from racknova_sync_worker import ensure_sync_schema

          SQLModel.metadata.create_all(engine)
          main.ejecutar_migraciones_ligeras()
          with Session(engine) as s:
              ensure_sync_schema(s)
              cfg = s.exec(text("SELECT empresa_id::text, sync_uuid::text FROM racknova_scan_configuracion LIMIT 1")).first()
              loc = s.exec(text("SELECT id_ubicacion::text, sync_uuid::text FROM racknova_ubicacion_identidad LIMIT 1")).first()
              assert cfg[0] == cfg[1], cfg
              assert loc[0] == loc[1], loc
          print('Deterministic identities OK')
          PY
      - name: Validate constructors and commit functional patch
        run: |
          grep -q 'sync_uuid=UUID(_rn_current_empresa_id(session))' scan_control_module.py
          grep -q 'sync_uuid=location_id' scan_control_module.py
          grep -q 'SET sync_uuid = empresa_id' main.py
          grep -q 'SET sync_uuid = id_ubicacion' main.py
          git diff --check
          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add scan_control_module.py main.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: make scan sync identities deterministic"
            git push origin HEAD:feat/scan-config-location-sync
          fi
