name: Patch Local AI Online Relay

on:
  push:
    branches:
      - feat/local-ai-online-relay-v2

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'feat: route local RackNova IA through cloud' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/local-ai-online-relay-v2
          fetch-depth: 0

      - name: Patch IA copilot and Sync relay route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ia_copilot.py')
          text = path.read_text(encoding='utf-8')

          old_credentials = '''    api_key = os.getenv("DEEPSEEK_API_KEY")\n    if not api_key:\n        raise RuntimeError("Falta configurar DEEPSEEK_API_KEY.")\n\n    model = os.getenv("DEEPSEEK_MODEL", "deepseek-v4-flash")\n'''
          new_credentials = '''    is_local_runtime = normalizar(os.getenv("RACKNOVA_MODE")) == "local"\n    api_key = os.getenv("DEEPSEEK_API_KEY")\n    if not is_local_runtime and not api_key:\n        raise RuntimeError("Falta configurar DEEPSEEK_API_KEY.")\n\n    model = os.getenv("DEEPSEEK_MODEL", "deepseek-v4-flash")\n'''

          if 'request_deepseek_via_racknova_cloud' not in text:
              if text.count(old_credentials) != 1:
                  raise SystemExit(
                      f'ia_copilot credential marker inesperado: {text.count(old_credentials)}'
                  )
              text = text.replace(old_credentials, new_credentials, 1)

              old_call = '''    resultado = solicitar_deepseek(\n        api_key=api_key,\n        model=model,\n        messages=messages,\n        max_tokens=max_tokens,\n        user_id=user_id,\n    )\n'''
              new_call = '''    if is_local_runtime:\n        # La PC local nunca recibe DEEPSEEK_API_KEY. El contexto compacto\n        # viaja por HTTPS a RackNova Cloud usando la credencial del nodo.\n        from racknova_ai_relay import request_deepseek_via_racknova_cloud\n\n        resultado = request_deepseek_via_racknova_cloud(\n            messages=messages,\n            max_tokens=max_tokens,\n            user_id=user_id,\n        )\n    else:\n        resultado = solicitar_deepseek(\n            api_key=api_key,\n            model=model,\n            messages=messages,\n            max_tokens=max_tokens,\n            user_id=user_id,\n        )\n'''
              if text.count(old_call) != 1:
                  raise SystemExit(
                      f'ia_copilot requester marker inesperado: {text.count(old_call)}'
                  )
              text = text.replace(old_call, new_call, 1)
              path.write_text(text, encoding='utf-8')

          path = Path('racknova_sync_worker.py')
          text = path.read_text(encoding='utf-8')

          import_marker = 'from racknova_runtime import ensure_node_registered, load_runtime_config\n'
          import_line = '''from racknova_ai_relay import (\n    RackNovaAICloudCompletionRequest,\n    request_deepseek_from_cloud,\n)\n'''
          if import_line not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit('racknova_sync_worker import marker inesperado')
              text = text.replace(import_marker, import_marker + import_line, 1)

          route_marker = '    # Endpoint máquina-a-máquina. No usa login de usuario.\n'
          if '/sync/v1/ai/complete' not in text:
              route = '''    # RackNova IA Local -> Cloud. La API key del proveedor nunca sale de Cloud.\n    @app.post("/sync/v1/ai/complete", tags=["RackNova IA"])\n    def racknova_sync_ai_complete(\n        body: RackNovaAICloudCompletionRequest,\n        x_sync_secret: str | None = Header(\n            default=None,\n            alias="X-RackNova-Sync-Secret",\n        ),\n        session: Session = Depends(get_session),\n    ):\n        _require_sync_secret(x_sync_secret)\n        config = load_runtime_config()\n        if not config.is_cloud:\n            raise HTTPException(\n                status_code=409,\n                detail="El relay de RackNova IA solo está disponible en modo cloud.",\n            )\n\n        empresa_id = _validate_uuid(body.empresa_id, "empresa_id")\n        if not _company_exists(session, empresa_id):\n            raise HTTPException(\n                status_code=404,\n                detail="Empresa no encontrada o inactiva.",\n            )\n\n        node_exists = session.connection().execute(\n            sa_text(\n                """\n                SELECT 1\n                FROM racknova_nodos\n                WHERE empresa_id=CAST(:empresa AS UUID)\n                  AND codigo=:codigo\n                  AND activo=TRUE\n                LIMIT 1\n                """\n            ),\n            {\n                "empresa": empresa_id,\n                "codigo": str(body.origin_node_code),\n            },\n        ).scalar_one_or_none()\n        if not node_exists:\n            raise HTTPException(\n                status_code=403,\n                detail="El nodo local no está registrado o está inactivo.",\n            )\n\n        return request_deepseek_from_cloud(\n            messages=[item.model_dump() for item in body.messages],\n            max_tokens=body.max_tokens,\n            user_id=body.user_id,\n        )\n\n'''
              if text.count(route_marker) != 1:
                  raise SystemExit(
                      f'racknova_sync_worker route marker inesperado: {text.count(route_marker)}'
                  )
              text = text.replace(route_marker, route + route_marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile \
            racknova_ai_relay.py \
            ia_copilot.py \
            racknova_sync_worker.py

          python - <<'PY'
          from pathlib import Path
          from racknova_ai_relay import (
              RackNovaAICloudCompletionRequest,
              RackNovaAIMessage,
          )

          req = RackNovaAICloudCompletionRequest(
              empresa_id='11111111-1111-4111-8111-111111111111',
              origin_node_code='LOCAL-TEST',
              messages=[RackNovaAIMessage(role='user', content='hola')],
              max_tokens=256,
              user_id='racknova_test',
          )
          assert req.max_tokens == 256

          ia = Path('ia_copilot.py').read_text(encoding='utf-8')
          sync = Path('racknova_sync_worker.py').read_text(encoding='utf-8')
          assert 'request_deepseek_via_racknova_cloud' in ia
          assert 'normalizar(os.getenv("RACKNOVA_MODE")) == "local"' in ia
          assert '/sync/v1/ai/complete' in sync
          assert 'request_deepseek_from_cloud' in sync
          print('RackNova IA relay static validation OK')
          PY

          git diff --check
          git diff --stat

      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet -- ia_copilot.py racknova_sync_worker.py; then
            echo "No source changes to commit"
            exit 0
          fi

          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add ia_copilot.py racknova_sync_worker.py
          git commit -m "feat: route local RackNova IA through cloud"
          git push origin HEAD:feat/local-ai-online-relay-v2
