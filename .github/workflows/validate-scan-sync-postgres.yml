name: Validate Scan Sync PostgreSQL

on:
  push:
    branches:
      - feat/scan-config-location-sync

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: racknova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d racknova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/racknova_test?sslmode=disable
      RACKNOVA_MODE: cloud
      RACKNOVA_NODE_CODE: CLOUD-TEST
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/scan-config-location-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create pre-sync Phase 3 tables
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d racknova_test <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE IF NOT EXISTS empresas (
            id_empresa UUID PRIMARY KEY,
            nombre VARCHAR(180) DEFAULT 'Test',
            slug VARCHAR(180) DEFAULT 'test',
            activo BOOLEAN NOT NULL DEFAULT TRUE,
            plan VARCHAR(80) DEFAULT 'test',
            moneda VARCHAR(20) DEFAULT 'MXN',
            zona_horaria VARCHAR(80) DEFAULT 'America/Mexico_City'
          );
          INSERT INTO empresas(id_empresa, activo)
          VALUES ('11111111-1111-4111-8111-111111111111', TRUE)
          ON CONFLICT (id_empresa) DO NOTHING;

          CREATE TABLE racknova_scan_configuracion (
            empresa_id UUID NOT NULL,
            id_configuracion UUID PRIMARY KEY,
            pos_verificacion_requerida BOOLEAN NOT NULL DEFAULT FALSE,
            ubicacion_verificacion_requerida BOOLEAN NOT NULL DEFAULT FALSE,
            hid_habilitado BOOLEAN NOT NULL DEFAULT TRUE,
            camara_habilitada BOOLEAN NOT NULL DEFAULT TRUE,
            fecha_actualizacion TIMESTAMP NOT NULL,
            actualizado_por VARCHAR NOT NULL DEFAULT 'Sistema'
          );
          INSERT INTO racknova_scan_configuracion(
            empresa_id, id_configuracion, fecha_actualizacion
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            NOW()
          );

          CREATE TABLE racknova_ubicacion_identidad (
            empresa_id UUID NOT NULL,
            id_ubicacion UUID PRIMARY KEY,
            codigo_ubicacion VARCHAR NOT NULL UNIQUE,
            nombre VARCHAR NOT NULL,
            rack VARCHAR,
            nivel VARCHAR,
            posicion VARCHAR,
            descripcion VARCHAR,
            activa BOOLEAN NOT NULL DEFAULT TRUE,
            fecha_creacion TIMESTAMP NOT NULL,
            fecha_actualizacion TIMESTAMP NOT NULL,
            creado_por VARCHAR NOT NULL DEFAULT 'Sistema',
            actualizado_por VARCHAR NOT NULL DEFAULT 'Sistema'
          );
          INSERT INTO racknova_ubicacion_identidad(
            empresa_id, id_ubicacion, codigo_ubicacion, nombre,
            fecha_creacion, fecha_actualizacion
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
            'RNLOC:test-existing', 'Rack Test', NOW(), NOW()
          );
          SQL
      - name: Run RackNova lightweight migration and B3 trigger setup
        run: |
          python - <<'PY'
          import main
          from sqlmodel import SQLModel, Session
          from database import engine
          from racknova_sync_worker import ensure_sync_schema, _table_meta

          SQLModel.metadata.create_all(engine)
          main.ejecutar_migraciones_ligeras()
          with Session(engine) as session:
              ensure_sync_schema(session)
              for table in ('racknova_scan_configuracion', 'racknova_ubicacion_identidad'):
                  meta = _table_meta(session, table)
                  assert 'sync_uuid' in meta['columns']
                  assert 'sync_revision' in meta['columns']
                  assert 'sync_updated_at' in meta['columns']
                  assert 'sync_origen_nodo' in meta['columns']
          print('Migration + B3 metadata OK')
          PY
      - name: Verify existing rows and B3 revision trigger
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d racknova_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            c_uuid UUID;
            l_uuid UUID;
            c_rev BIGINT;
          BEGIN
            SELECT sync_uuid INTO c_uuid FROM racknova_scan_configuracion
            WHERE id_configuracion='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
            SELECT sync_uuid INTO l_uuid FROM racknova_ubicacion_identidad
            WHERE id_ubicacion='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
            IF c_uuid IS NULL OR l_uuid IS NULL THEN
              RAISE EXCEPTION 'Existing rows were not backfilled with sync_uuid';
            END IF;

            UPDATE racknova_scan_configuracion
            SET hid_habilitado=FALSE
            WHERE id_configuracion='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
            SELECT sync_revision INTO c_rev FROM racknova_scan_configuracion
            WHERE id_configuracion='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
            IF c_rev < 1 THEN
              RAISE EXCEPTION 'B3 revision trigger did not run';
            END IF;
          END $$;
          SQL
