name: Runtime Scan Control Phase 3

on:
  push:
    branches:
      - feat/scan-options-location-identity

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/scan-options-location-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install fastapi sqlmodel
      - name: Import models and validate metadata
        run: |
          python - <<'PY'
          from sqlmodel import SQLModel
          import scan_control_module as scan

          names = set(SQLModel.metadata.tables.keys())
          assert "racknova_scan_configuracion" in names
          assert "racknova_ubicacion_identidad" in names
          defaults = scan.RackNovaScanConfiguracion(
              fecha_actualizacion=__import__('datetime').datetime.now()
          )
          assert defaults.pos_verificacion_requerida is False
          assert defaults.ubicacion_verificacion_requerida is False
          assert defaults.hid_habilitado is True
          assert defaults.camara_habilitada is True
          loc = scan.RackNovaUbicacionIdentidad(
              codigo_ubicacion="RNLOC:test",
              nombre="Rack A3",
              fecha_creacion=__import__('datetime').datetime.now(),
              fecha_actualizacion=__import__('datetime').datetime.now(),
          )
          assert loc.codigo_ubicacion.startswith("RNLOC:")
          print("Runtime Scan Control Phase 3 OK")
          PY
