name: Validate Free Location Entry

on:
  push:
    branches:
      - feat/free-location-entry-flow

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/free-location-entry-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply functional patch
        run: python scripts/patch_free_location_entry.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile main.py pos_module.py scan_control_module.py racknova_sync_capture.py racknova_sync_worker.py
      - name: Validate free-location architecture
        run: |
          grep -q 'ubicacion_codigo: Optional\[str\]' main.py
          grep -q '"idx_producto_ubicacion_codigo_fast"' main.py
          grep -q 'producto.ubicacion_codigo = normalizar_texto' main.py
          grep -q 'producto_existente.ubicacion_codigo = producto.ubicacion_codigo' main.py
          grep -q 'RNLOC es una ubicación física libre' main.py
          grep -q 'getattr(producto, "ubicacion_codigo", None)' pos_module.py
          grep -q 'event_type="config.location.created"' scan_control_module.py
          git diff --check
      - name: Commit functional changes
        run: |
          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add main.py pos_module.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat: support free physical locations on inventory entry"
            git push origin HEAD:feat/free-location-entry-flow
          fi
