name: Validate Scan Terminal Independence

on:
  push:
    branches:
      - feat/scan-terminal-independence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/scan-terminal-independence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply functional patch
        run: python scripts/patch_scan_terminal_independence.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile scan_control_module.py racknova_sync_capture.py racknova_sync_worker.py
      - name: Validate architecture
        run: |
          python - <<'PY'
          import racknova_sync_worker as worker
          import racknova_sync_capture as capture
          from scan_control_module import RackNovaScanConfiguracion, RackNovaUbicacionIdentidad
          from datetime import datetime

          assert not worker._is_commercial_table('racknova_scan_configuracion')
          assert worker._is_commercial_table('racknova_ubicacion_identidad')
          cfg = RackNovaScanConfiguracion(fecha_actualizacion=datetime.now())
          loc = RackNovaUbicacionIdentidad(
              codigo_ubicacion='RNLOC:test', nombre='Rack A1',
              fecha_creacion=datetime.now(), fecha_actualizacion=datetime.now()
          )
          assert not capture._is_commercial_object(cfg)
          assert capture._is_commercial_object(loc)
          print('Scan preferences are local; RNLOC remains synchronized')
          PY
          ! grep -q 'event_type="config.scan.updated"' scan_control_module.py
          grep -q 'event_type="config.location.created"' scan_control_module.py
          grep -q 'event_type="config.location.updated"' scan_control_module.py
          grep -q 'event_type="config.location.deactivated"' scan_control_module.py
          grep -q '"racknova_ubicacion_"' racknova_sync_worker.py
          ! grep -q '"racknova_scan_"' racknova_sync_worker.py
          git diff --check
      - name: Commit functional changes
        run: |
          git config user.name "racknova096-dot"
          git config user.email "racknova096@gmail.com"
          git add scan_control_module.py racknova_sync_capture.py racknova_sync_worker.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: keep scan preferences local to each terminal"
            git push origin HEAD:feat/scan-terminal-independence
          fi
